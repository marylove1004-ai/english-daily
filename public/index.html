<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Language Daily</title>
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400&family=Lora:ital,wght@0,400;0,500;1,400&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #080d16; }
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: #0f1623; }
    ::-webkit-scrollbar-thumb { background: #1e2d45; border-radius: 3px; }
    @keyframes pulse { 0%,100%{transform:scale(1)} 50%{transform:scale(1.08)} }
    @keyframes ripple { 0%{transform:scale(1);opacity:0.6} 100%{transform:scale(2.2);opacity:0} }
    .mic-pulse { animation: pulse 1s infinite; }
    .ripple::after { content:''; position:absolute; inset:0; border-radius:50%; border:2px solid #e8b84b; animation:ripple 1.2s infinite; }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // ── 설정: 뉴스, 시사, 비즈니스 중심 카테고리 개편 ────────────
    const LANG_CONFIG = {
      English: {
        code: "en-US", name: "영어", title: "ENGLISH DAILY", emoji: "🇬🇧", voiceStart: "en",
        categories: ["Global News", "Tech & Business", "Culture & Society", "Science & Health", "Entertainment", "Lifestyle"],
        topicPrompt: "Find 5 diverse, highly relevant topics in English today. Mix important global news, latest tech/business trends, societal issues, and cultural events. Make it informative, engaging, and thought-provoking. Avoid trivial gossip and focus on topics adults would discuss at a networking event or read in a reputable newspaper.",
      },
      French: {
        code: "fr-FR", name: "프랑스어", title: "FRENCH DAILY", emoji: "🇫🇷", voiceStart: "fr",
        categories: ["Actualités Mondiales", "Tech & Business", "Culture & Société", "Science & Santé", "Divertissement", "Mode de Vie"],
        topicPrompt: "Find 5 diverse, highly relevant topics in French today. Mix important global news, French society issues, tech trends, and culture. Make it informative and engaging. Avoid trivial gossip and focus on meaningful discussions.",
      },
    };

    // ── API 통신 ──────────────────────────────────────────────────────────
    async function callAI(userMsg, system, useSearch=false) {
      const body = { system, messages: [{ role: "user", content: userMsg }] };
      if(useSearch) body.tools = [{ type: "web_search", name: "web_search" }];
      
      const res = await fetch("/api/chat", { 
        method: "POST", 
        headers: { "Content-Type": "application/json" }, 
        body: JSON.stringify(body) 
      });
      
      if(!res.ok){
        const e = await res.json().catch(()=>({}));
        throw new Error(e.error || "API 오류");
      }
      const data = await res.json();
      if(data.error) throw new Error(data.error);
      return data.content[0].text;
    }

    function parseJSON(text) {
      let c=text.replace(/```json\n?/g,"").replace(/```\n?/g,"").trim();
      const s=c.indexOf('{'),e=c.lastIndexOf('}');
      if(s!==-1&&e!==-1) c=c.slice(s,e+1);
      try{return JSON.parse(c);}
      catch{c=c.replace(/[\r\n]+/g," ").replace(/,\s*([}\]])/g,'$1');return JSON.parse(c);}
    }

    // ── TTS ───────────────────────────────────────────────────────────
    function speak(text, rate=0.85, onEnd, langCode="en-US", voiceStart="en") {
      window.speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(text);
      u.lang = langCode;
      u.rate = rate;
      const v = window.speechSynthesis.getVoices();
      const voice =
        v.find(x => x.lang === langCode && x.name.includes("Google")) ||
        v.find(x => x.lang === langCode) || 
        v.find(x => x.lang.startsWith(voiceStart)) ||
        v.find(x => x.lang.includes(voiceStart));
      if(voice) u.voice = voice;
      if(onEnd) u.onend = onEnd;
      window.speechSynthesis.speak(u);
    }
    function stopSpeak(){window.speechSynthesis.cancel();}

    // ── STT ──────────────────────────────────────────────────────────
    const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
    const hasMic=!!SR;

    // ── Streak ──────────────────────────────────────────
    function loadStreak(langKey){
      try{
        const d=JSON.parse(localStorage.getItem(`daily_streak_${langKey}`)||"{}");
        const today=new Date().toDateString(),yesterday=new Date(Date.now()-86400000).toDateString();
        if(d.lastDate===today||d.lastDate===yesterday) return d.streak||0;
        return 0;
      }catch{return 0;}
    }
    function saveStreak(n,langKey){
      localStorage.setItem(`daily_streak_${langKey}`,JSON.stringify({streak:n,lastDate:new Date().toDateString()}));
    }

    // ── Share ─────────────────────────────────────────────────────────
    function buildShareText(topic,lesson,selectedQ,feedback,finalFb,streak,langTitle) {
      const date=new Date().toLocaleDateString("ko-KR");
      let t=`📖 ${langTitle} 복습 노트\n📅 ${date}  🔥 ${streak}일 연속\n${'─'.repeat(30)}\n\n`;
      t+=`🎯 오늘의 주제\n${topic?.title}\n${topic?.teaser}\n\n`;
      if(lesson?.expressions?.length){
        t+=`⚡ 핵심 표현\n`;
        lesson.expressions.forEach(e=>{t+=`• "${e.phrase}" — ${e.korean}\n  예: ${e.example}\n`;});
        t+=`\n`;
      }
      if(lesson?.shadowSentences?.length){
        t+=`🔁 쉐도잉 문장\n`;
        lesson.shadowSentences.forEach((s,i)=>{t+=`${i+1}. ${s.text}\n  🇰🇷 ${s.meaning}\n`;});
        t+=`\n`;
      }
      if(selectedQ) t+=`💬 스피킹 질문 (${selectedQ.level})\n${selectedQ.question}\n\n`;
      if(feedback?.correctedVersion) t+=`✅ 교정된 답변\n${feedback.correctedVersion}\n\n`;
      if(feedback?.corrections?.length){
        t+=`📝 교정 포인트\n`;
        feedback.corrections.forEach(c=>{t+=`• ${c.original} → ${c.correction}\n  🇰🇷 ${c.explanation}\n`;});
        t+=`\n`;
      }
      if(feedback?.naturalExpressions?.length){
        t+=`⚡ 원어민 표현\n`;
        feedback.naturalExpressions.forEach(e=>{t+=`• "${e.expression}"\n  🇰🇷 ${e.usage}\n`;});
        t+=`\n`;
      }
      if(finalFb?.todaysPhrases?.length){
        t+=`💡 오늘 배운 핵심 표현\n`;
        finalFb.todaysPhrases.forEach((p,i)=>{t+=`${i+1}. ${p}\n`;});
        t+=`\n`;
      }
      if(finalFb?.finalNote) t+=`${finalFb.finalNote}\n`;
      return t;
    }

    async function shareResult(text,title) {
      if(navigator.share){try{await navigator.share({title:title+" 복습 노트",text});return "shared";}catch{}}
      try{await navigator.clipboard.writeText(text);return "copied";}
      catch{return "failed";}
    }

    // ── Design ───────────────────────────────────────────────────────
    const C={bg:"#080d16",card:"#0f1623",cardBorder:"#1e2d45",cream:"#f0e8d5",creamMuted:"#a89880",gold:"#c8962a",goldLight:"#e8b84b",success:"#34d399",error:"#f87171",muted:"#4a5568",blue:"#3b8eff"};
    const LEVEL_COLOR={Beginner:"#34d399",Intermediate:C.gold,Advanced:"#f87171"};
    const LEVEL_EMOJI={Beginner:"🟢",Intermediate:"🟡",Advanced:"🔴"};
    
    // 개편된 카테고리에 맞춘 색상표
    const CAT_COLOR={
      "Global News":"#6366f1", "Actualités Mondiales":"#6366f1",
      "Tech & Business":"#3b82f6", 
      "Culture & Society":"#8b5cf6", "Culture & Société":"#8b5cf6",
      "Science & Health":"#10b981", "Science & Santé":"#10b981",
      "Entertainment":"#ec4899", "Divertissement":"#ec4899",
      "Lifestyle":"#f59e0b", "Mode de Vie":"#f59e0b",
    };
    
    const S={
      app:{minHeight:"100vh",background:C.bg,color:C.cream,fontFamily:"'Lora',Georgia,serif",paddingBottom:60},
      header:{borderBottom:`1px solid ${C.cardBorder}`,padding:"16px 22px 12px",display:"flex",justifyContent:"space-between",alignItems:"center",position:"sticky",top:0,background:C.bg,zIndex:100},
      masthead:{fontFamily:"'Cormorant Garamond',serif",fontSize:20,fontWeight:600,letterSpacing:"0.08em",color:C.gold},
      body:{maxWidth:680,margin:"0 auto",padding:"0 16px"},
      card:{background:C.card,border:`1px solid ${C.cardBorder}`,borderRadius:12,padding:"18px 20px",marginBottom:12},
      btn:{background:C.gold,color:C.bg,border:"none",borderRadius:10,padding:"15px 28px",fontSize:15,fontWeight:600,fontFamily:"'DM Sans',sans-serif",cursor:"pointer",width:"100%"},
      btnSec:{background:"transparent",color:C.creamMuted,border:`1px solid ${C.cardBorder}`,borderRadius:10,padding:"12px 24px",fontSize:14,fontFamily:"'DM Sans',sans-serif",cursor:"pointer",width:"100%",marginTop:10},
      label:{fontFamily:"'DM Sans',sans-serif",fontSize:11,letterSpacing:"0.12em",textTransform:"uppercase",color:C.creamMuted,marginBottom:8,display:"block"},
      h2:{fontFamily:"'Cormorant Garamond',serif",fontSize:26,fontWeight:600,color:C.cream,margin:"0 0 6px"},
      h3:{fontFamily:"'DM Sans',sans-serif",fontSize:12,fontWeight:500,letterSpacing:"0.1em",textTransform:"uppercase",color:C.gold,margin:"0 0 10px"},
      textarea:{width:"100%",background:"#0a1220",border:`1px solid ${C.cardBorder}`,borderRadius:8,padding:14,color:C.cream,fontFamily:"'Lora',serif",fontSize:15,lineHeight:1.7,resize:"vertical",outline:"none",boxSizing:"border-box",minHeight:110},
    };

    // ── Components ───────────────────────────────────────────────────
    function StepBar({step}){
      const steps=["주제","듣기","쉐도잉","말하기","피드백"];
      return(
        <div style={{display:"flex",alignItems:"center",marginBottom:22,marginTop:4}}>
          {steps.map((s,i)=>(
            <div key={i} style={{display:"flex",alignItems:"center",flex:i<steps.length-1?1:0}}>
              <div title={s} style={{width:25,height:25,borderRadius:"50%",background:i<step?C.gold:i===step?C.goldLight:C.cardBorder,color:i<=step?C.bg:C.muted,display:"flex",alignItems:"center",justifyContent:"center",fontSize:10,fontFamily:"'DM Sans',sans-serif",fontWeight:700,flexShrink:0}}>
                {i<step?"✓":i+1}
              </div>
              {i<steps.length-1&&<div style={{flex:1,height:1,background:i<step?C.gold:C.cardBorder,margin:"0 3px"}}/>}
            </div>
          ))}
        </div>
      );
    }

    function ListenBtn({text,rate=0.85,label="🔊 듣기",langCode="en-US",voiceStart="en"}){
      const [playing,setPlaying]=useState(false);
      function toggle(){if(playing){stopSpeak();setPlaying(false);}else{setPlaying(true);speak(text,rate,()=>setPlaying(false),langCode,voiceStart);}}
      return(
        <button onClick={toggle} style={{background:playing?"#1e3a5f":"#0d1f35",border:`1px solid ${playing?C.blue:C.cardBorder}`,borderRadius:8,padding:"8px 14px",color:playing?C.blue:C.creamMuted,fontFamily:"'DM Sans',sans-serif",fontSize:13,cursor:"pointer",display:"flex",alignItems:"center",gap:6}}>
          {playing?"⏹ 중지":label}
        </button>
      );
    }

    function TopicCard({topic,onSelect}){
      const [hov,setHov]=useState(false);
      const diff={Beginner:"#34d399",Intermediate:C.gold,Advanced:"#f87171"};
      const catColor=CAT_COLOR[topic.category]||C.gold;
      return(
        <div onClick={()=>onSelect(topic)} onMouseEnter={()=>setHov(true)} onMouseLeave={()=>setHov(false)}
          style={{...S.card,cursor:"pointer",border:`1px solid ${hov?C.gold:C.cardBorder}`,transition:"all 0.2s",transform:hov?"translateY(-2px)":"none"}}>
          <div style={{display:"flex",justifyContent:"space-between",marginBottom:8}}>
            <div style={{display:"flex",alignItems:"center",gap:8}}>
              <span style={{fontSize:18}}>{topic.emoji}</span>
              <span style={{fontFamily:"'DM Sans',sans-serif",fontSize:10,letterSpacing:"0.1em",textTransform:"uppercase",color:catColor}}>{topic.category}</span>
            </div>
            <span style={{fontFamily:"'DM Sans',sans-serif",fontSize:11,color:diff[topic.difficulty]||C.gold,background:(diff[topic.difficulty]||C.gold)+"22",borderRadius:20,padding:"2px 10px"}}>{topic.difficulty}</span>
          </div>
          <div style={{fontFamily:"'Cormorant Garamond',serif",fontSize:19,fontWeight:600,color:C.cream,marginBottom:4}}>{topic.title}</div>
          <div style={{fontSize:13,color:C.creamMuted,lineHeight:1.6}}>{topic.teaser}</div>
        </div>
      );
    }

    function QuestionCard({q,selected,onSelect,langCode,voiceStart}){
      const lc=LEVEL_COLOR[q.level]||C.gold;
      return(
        <div onClick={()=>onSelect(q)}
          style={{...S.card,cursor:"pointer",border:`2px solid ${selected?lc:C.cardBorder}`,background:selected?lc+"11":"#0f1623",transition:"all 0.2s",marginBottom:10}}>
          <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:10}}>
            <span style={{fontSize:14}}>{LEVEL_EMOJI[q.level]}</span>
            <span style={{fontFamily:"'DM Sans',sans-serif",fontSize:11,fontWeight:600,letterSpacing:"0.08em",textTransform:"uppercase",color:lc}}>{q.level}</span>
            {selected&&<span style={{marginLeft:"auto",fontFamily:"'DM Sans',sans-serif",fontSize:11,color:lc}}>✓ 선택됨</span>}
          </div>
          <div style={{fontFamily:"'Cormorant Garamond',serif",fontSize:19,color:C.cream,lineHeight:1.55,marginBottom:q.hint?10:0}}>{q.question}</div>
          {q.hint&&<div style={{fontSize:12,color:C.creamMuted,fontFamily:"'DM Sans',sans-serif",padding:"8px 12px",background:"#0a1220",borderRadius:6}}>💡 {q.hint}</div>}
          <div style={{marginTop:10}}><ListenBtn text={q.question} label="🔊 듣기" langCode={langCode} voiceStart={voiceStart}/></div>
        </div>
      );
    }

    function MicButton({onTranscript,langCode}){
      const [state,setState]=useState("idle");
      const [interim,setInterim]=useState("");
      const recRef=useRef(null);
      function startListen(){
        if(!SR) return;
        stopSpeak();
        const rec=new SR();
        rec.lang=langCode;rec.continuous=true;rec.interimResults=true;
        rec.onresult=(e)=>{
          let fin="",inter="";
          for(let r of e.results){if(r.isFinal)fin+=r[0].transcript+" ";else inter+=r[0].transcript;}
          if(fin) onTranscript(p=>p+fin);
          setInterim(inter);
        };
        rec.onerror=()=>{setState("idle");setInterim("");};
        rec.onend=()=>{setState("done");setInterim("");};
        recRef.current=rec;rec.start();setState("listening");
      }
      function stopListen(){recRef.current?.stop();setState("done");setInterim("");}
      return(
        <div style={{textAlign:"center",padding:"14px 0"}}>
          <div style={{position:"relative",display:"inline-block",marginBottom:10}}>
            <button onClick={state==="listening"?stopListen:startListen}
              className={state==="listening"?"mic-pulse ripple":""}
              style={{width:76,height:76,borderRadius:"50%",background:state==="listening"?"#c8962a22":state==="done"?"#1e3a2a":"#1e2d45",border:`2px solid ${state==="listening"?C.gold:state==="done"?C.success:C.cardBorder}`,fontSize:30,cursor:"pointer",position:"relative",display:"flex",alignItems:"center",justifyContent:"center",transition:"all 0.2s"}}>
              {state==="listening"?"⏹":state==="done"?"✓":"🎤"}
            </button>
          </div>
          <div style={{fontFamily:"'DM Sans',sans-serif",fontSize:13,color:state==="listening"?C.gold:state==="done"?C.success:C.creamMuted}}>
            {state==="listening"?"듣는 중... 말을 마치면 자동 종료":state==="done"?"녹음 완료":"버튼을 누르고 해당 언어로 말하세요"}
          </div>
          {interim&&<div style={{marginTop:6,color:C.creamMuted,fontSize:13,fontStyle:"italic",padding:"0 16px"}}>{interim}</div>}
        </div>
      );
    }

    // ── Main App ─────────────────────────────────────────────────────
    function App(){
      const [screen,setScreen]=useState("home");
      const [activeLang,setActiveLang]=useState("English");
      const [streak,setStreak]=useState(0);
      const [topics,setTopics]=useState([]);
      const [topic,setTopic]=useState(null);
      const [lesson,setLesson]=useState(null);
      const [done,setDone]=useState([]);
      const [selectedQ,setSelectedQ]=useState(null);
      const [userResp,setUserResp]=useState("");
      const [feedback,setFeedback]=useState(null);
      const [followup,setFollowup]=useState("");
      const [finalFb,setFinalFb]=useState(null);
      const [loadingMsg,setLoadingMsg]=useState("");
      const [error,setError]=useState(null);
      const [shareStatus,setShareStatus]=useState("");

      const L=LANG_CONFIG[activeLang];

      useEffect(()=>{setStreak(loadStreak(activeLang));},[activeLang]);

      function switchLang(k){
        if(k===activeLang) return;
        if(screen!=="home"&&screen!=="selecting"){
          if(!window.confirm("언어를 바꾸면 현재 레슨이 초기화됩니다. 계속할까요?")) return;
        }
        setActiveLang(k);
        setTopic(null);setLesson(null);setUserResp("");setFeedback(null);
        setFollowup("");setFinalFb(null);setError(null);setDone([]);setSelectedQ(null);
        setTopics([]);
        stopSpeak();
        setScreen("home");
      }

      async function run(fn,fb){
        setError(null);
        try{await fn();}
        catch(e){setError(e.message||"오류 발생");if(fb)setScreen(fb);}
      }

      // 주제 검색 시 프롬프트 개편 (시사, 교양 위주)
      async function fetchTopics(){
        setLoadingMsg("오늘의 뉴스/시사 콘텐츠 검색 중");setScreen("loading");
        await run(async()=>{
          const catList=L.categories.join(", ");
          const sys=`You are a professional ${activeLang} learning assistant. ${L.topicPrompt}
Return ONLY valid JSON no markdown:
{"topics":[{"id":1,"category":"Global News","emoji":"🌍","title":"Engaging title in ${activeLang}","teaser":"One engaging ${activeLang} sentence summarizing the core issue","difficulty":"Intermediate"}]}
Pick categories from this list: ${catList}
Focus on real-world news, current events, economy, and meaningful cultural trends. Do NOT output overly casual or bizarre internet gossip.`;
          const t=await callAI(L.topicPrompt,sys,true);
          setTopics(parseJSON(t).topics);setScreen("selecting");
        },"home");
      }

      // 레슨 생성 시 프롬프트 개편 (CEFR B1-B2 수준 문장, 뉴스 앵커 톤)
      async function startLesson(t){
        setTopic(t);setDone([]);setSelectedQ(null);
        setLoadingMsg("리스닝 콘텐츠 준비 중");setScreen("loading");
        await run(async()=>{
          const sys=`You are a professional ${activeLang} teacher. Return ONLY valid JSON no markdown:
{"summary":"2 clear, informative ${activeLang} sentences summarizing the news/topic like a neat news anchor","shadowSentences":[{"text":"natural ${activeLang} sentence from the topic (CEFR B1-B2 level)","meaning":"한국어 뜻"}],"expressions":[{"phrase":"useful ${activeLang} idiom or professional phrase","korean":"한국어 의미","example":"practical example sentence"}],"speakingQuestions":[{"level":"Beginner","question":"Simple yes/no or factual question about this topic in ${activeLang}","hint":"이렇게 시작해보세요: (한국어로 구체적인 문장 시작 예시)"},{"level":"Intermediate","question":"Question asking for their personal opinion or experience related to the news","hint":""},{"level":"Advanced","question":"Deep analytical question requiring them to discuss pros/cons or societal impact","hint":""}]}
Exactly 5 shadowSentences (informative, professional but conversational). Exactly 3 expressions. Exactly 3 speakingQuestions scaling clearly in difficulty. Beginner hint must be written in Korean.`;
          const t2=await callAI(`Lesson for: ${t.title}\nContext: ${t.teaser}`,sys,true);
          setLesson(parseJSON(t2));setScreen("listening");
        },"selecting");
      }

      async function submitSpeaking(){
        if(!userResp.trim()||!selectedQ) return;
        setLoadingMsg("답변 분석 중");setScreen("loading");
        await run(async()=>{
          const sys=`You are a professional ${activeLang} teacher. Return ONLY valid JSON no markdown. All explanations in Korean.
{"correctedVersion":"naturally corrected ${activeLang} — sound clear and professional","corrections":[{"original":"exact phrase","correction":"better phrase","explanation":"왜 틀렸는지 또는 왜 이게 더 적절한지 한국어로 설명"}],"naturalExpressions":[{"expression":"professional ${activeLang} phrase","usage":"언제 어떻게 쓰는지 한국어로 설명"}],"followUpQuestion":"insightful follow-up question in ${activeLang}","encouragement":"한국어로 짧고 따뜻한 격려 한마디"}
0-3 corrections for real errors only. Exactly 3 naturalExpressions.`;
          const t=await callAI(`Topic: ${topic.title}\nLevel: ${selectedQ.level}\nQ: ${selectedQ.question}\nStudent: ${userResp}`,sys);
          setFeedback(parseJSON(t));setScreen("feedback");
        },"speaking");
      }

      async function submitFollowup(){
        if(!followup.trim()) return;
        setLoadingMsg("마무리 피드백 정리 중");setScreen("loading");
        await run(async()=>{
          const sys=`You are a professional ${activeLang} teacher. Return ONLY valid JSON no markdown.
{"correctedVersion":"corrected ${activeLang}","corrections":[{"original":"","correction":"","explanation":"한국어 설명"}],"finalNote":"오늘 학습에 대한 격려 코멘트 한국어 2문장","todaysPhrases":["오늘 배운 핵심 ${activeLang} 표현 1","표현 2","표현 3"]}
0-3 corrections. todaysPhrases must be ${activeLang} phrases (not Korean).`;
          const t=await callAI(`Q: ${feedback.followUpQuestion}\nAnswer: ${followup}`,sys);
          const d=parseJSON(t);setFinalFb(d);
          const ns=streak+1;setStreak(ns);saveStreak(ns,activeLang);
          setScreen("complete");
        },"feedback");
      }

      async function handleShare(){
        const text=buildShareText(topic,lesson,selectedQ,feedback,finalFb,streak,L.title);
        const result=await shareResult(text,L.title);
        setShareStatus(result);
        setTimeout(()=>setShareStatus(""),3000);
      }

      function reset(){
        setTopic(null);setLesson(null);setUserResp("");setFeedback(null);
        setFollowup("");setFinalFb(null);setError(null);setDone([]);setSelectedQ(null);
        stopSpeak();setScreen("home");
      }

      return(
        <div style={S.app}>
          <div style={S.header}>
            <div style={S.masthead}>{L.title}</div>
            <div style={{textAlign:"right"}}>
              {streak>0&&<div style={{fontFamily:"'DM Sans',sans-serif",fontSize:13,color:C.gold}}>🔥 {streak}일 연속</div>}
              <div style={{fontFamily:"'DM Sans',sans-serif",fontSize:11,color:C.muted,marginTop:2}}>{new Date().toLocaleDateString("ko-KR")}</div>
            </div>
          </div>

          {error&&(
            <div style={{background:"#2a0a0a",borderBottom:`1px solid #5a2020`,padding:"12px 22px",color:C.error,fontFamily:"'DM Sans',sans-serif",fontSize:13,display:"flex",justifyContent:"space-between",alignItems:"center"}}>
              <span>⚠️ {error}</span>
              <button onClick={()=>setError(null)} style={{background:"none",border:"none",color:C.error,cursor:"pointer",fontSize:16}}>✕</button>
            </div>
          )}

          <div style={S.body}>
            {/* LOADING */}
            {screen==="loading"&&(
              <div style={{textAlign:"center",padding:"80px 20px"}}>
                <div style={{fontSize:40,marginBottom:16}}>📰</div>
                <div style={{fontFamily:"'Cormorant Garamond',serif",fontSize:22,color:C.cream,marginBottom:8}}>{loadingMsg}...</div>
                <div style={{color:C.muted,fontSize:13,fontFamily:"'DM Sans',sans-serif"}}>잠시만 기다려주세요</div>
              </div>
            )}

            {/* HOME */}
            {screen==="home"&&(
              <div style={{paddingTop:36}}>
                <div style={{display:"flex",justifyContent:"center",gap:10,marginBottom:28}}>
                  {Object.keys(LANG_CONFIG).map(k=>(
                    <button key={k} onClick={()=>switchLang(k)} style={{
                      background:activeLang===k?C.gold:"transparent",
                      color:activeLang===k?C.bg:C.creamMuted,
                      border:`1px solid ${activeLang===k?C.gold:C.cardBorder}`,
                      padding:"9px 20px",borderRadius:20,fontSize:14,
                      fontFamily:"'DM Sans',sans-serif",cursor:"pointer",transition:"all 0.2s",
                      fontWeight:activeLang===k?600:400,
                    }}>
                      {LANG_CONFIG[k].emoji} {LANG_CONFIG[k].name}
                    </button>
                  ))}
                </div>

                <div style={{textAlign:"center",marginBottom:24}}>
                  <div style={{fontSize:48,marginBottom:10}}>📰</div>
                  <div style={{fontFamily:"'Cormorant Garamond',serif",fontSize:38,fontWeight:400,lineHeight:1.15,color:C.cream,marginBottom:8}}>
                    세상의 흐름을 읽고<br/><span style={{color:C.gold,fontStyle:"italic"}}>논리적으로 말하다</span>
                  </div>
                  <p style={{color:C.creamMuted,fontSize:14,lineHeight:1.9,marginTop:10}}>
                    매일 업데이트되는 글로벌 뉴스와 시사 이슈로<br/>
                    <strong style={{color:C.cream}}>듣기 → 쉐도잉 → 스피킹</strong> 루틴을 시작하세요.
                  </p>
                </div>

                <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:10,marginBottom:24}}>
                  {[["🌍","글로벌 뉴스"],["🔁","문장 쉐도잉"],["🎤","스피킹 및 교정"]].map(([e,l])=>(
                    <div key={l} style={{...S.card,textAlign:"center",padding:"14px 8px"}}>
                      <div style={{fontSize:20,marginBottom:6}}>{e}</div>
                      <div style={{fontFamily:"'DM Sans',sans-serif",fontSize:11,color:C.creamMuted}}>{l}</div>
                    </div>
                  ))}
                </div>

                <button style={S.btn} onClick={fetchTopics}>오늘의 {L.name} 이슈 가져오기 →</button>
              </div>
            )}

            {/* SELECTING */}
            {screen==="selecting"&&(
              <div style={{paddingTop:32}}>
                <StepBar step={0}/>
                <div style={S.label}>STEP 1 — 뉴스/시사 주제 선택 {L.emoji}</div>
                <div style={S.h2}>어떤 주제에 관심이 있으신가요?</div>
                <p style={{color:C.creamMuted,fontSize:13,marginBottom:18,lineHeight:1.7}}>선택하면 뉴스 요약본 듣기 → 핵심 문장 쉐도잉 → 스피킹 순서로 진행됩니다.</p>
                {topics.map(t=><TopicCard key={t.id} topic={t} onSelect={startLesson}/>)}
                <button style={S.btn} onClick={fetchTopics}>🔄 다른 이슈 가져오기</button>
                <button style={S.btnSec} onClick={()=>setScreen("home")}>← 홈으로</button>
              </div>
            )}

            {/* LISTENING */}
            {screen==="listening"&&lesson&&(
              <div style={{paddingTop:32}}>
                <StepBar step={1}/>
                <div style={S.label}>STEP 2 — 집중 듣기</div>
                <div style={S.h2}>{topic?.title}</div>
                <p style={{color:C.creamMuted,fontSize:13,fontFamily:"'DM Sans',sans-serif",marginBottom:18}}>{topic?.emoji} {topic?.category}</p>
                <div style={{...S.card,borderLeft:`3px solid ${C.gold}`}}>
                  <div style={S.h3}>📢 오늘의 브리핑 요약</div>
                  <p style={{color:C.cream,lineHeight:1.85,fontSize:15,marginBottom:14}}>{lesson.summary}</p>
                  <div style={{display:"flex",gap:8,flexWrap:"wrap"}}>
                    <ListenBtn text={lesson.summary} rate={0.85} label="🔊 보통 속도" langCode={L.code} voiceStart={L.voiceStart}/>
                    <ListenBtn text={lesson.summary} rate={0.65} label="🐢 느리게" langCode={L.code} voiceStart={L.voiceStart}/>
                  </div>
                </div>
                <div style={S.card}>
                  <div style={S.h3}>⚡ 비즈니스 / 시사 핵심 표현</div>
                  {lesson.expressions?.map((ex,i)=>(
                    <div key={i} style={{background:"#0a1220",border:`1px solid #1e3a2a`,borderRadius:8,padding:"12px 14px",marginBottom:10}}>
                      <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:6}}>
                        <div>
                          <span style={{fontFamily:"'Cormorant Garamond',serif",fontSize:17,color:C.goldLight}}>"{ex.phrase}"</span>
                          <span style={{fontFamily:"'DM Sans',sans-serif",fontSize:12,color:C.creamMuted,marginLeft:8}}>— {ex.korean}</span>
                        </div>
                        <ListenBtn text={ex.phrase} label="🔊" langCode={L.code} voiceStart={L.voiceStart}/>
                      </div>
                      <div style={{fontSize:12,color:C.muted,fontStyle:"italic"}}>"{ex.example}"</div>
                    </div>
                  ))}
                </div>
                <button style={S.btn} onClick={()=>setScreen("shadowing")}>쉐도잉 시작하기 →</button>
                <button style={S.btnSec} onClick={()=>setScreen("selecting")}>← 주제 다시 선택</button>
              </div>
            )}

            {/* SHADOWING */}
            {screen==="shadowing"&&lesson&&(
              <div style={{paddingTop:32}}>
                <StepBar step={2}/>
                <div style={S.label}>STEP 3 — 뉴스 쉐도잉</div>
                <div style={S.h2}>앵커처럼 또렷하게 말해보세요</div>
                <div style={{background:"#0a150a",border:`1px solid #1e3a1e`,borderRadius:10,padding:"12px 16px",marginBottom:18}}>
                  <div style={{color:C.success,fontFamily:"'DM Sans',sans-serif",fontSize:13,lineHeight:1.8}}>
                    💡 🔊 듣기 → 멈추고 똑같이 따라 말하기 → ✅ 체크<br/>문장의 억양과 강세에 집중해보세요.
                  </div>
                </div>
                {lesson.shadowSentences?.map((s,i)=>(
                  <div key={i} style={{...S.card,border:`1px solid ${done.includes(i)?C.success:C.cardBorder}`,transition:"border 0.2s"}}>
                    <div style={{fontFamily:"'Cormorant Garamond',serif",fontSize:19,color:C.cream,lineHeight:1.55,marginBottom:6}}>{s.text}</div>
                    <div style={{fontSize:12,color:C.creamMuted,marginBottom:12}}>🇰🇷 {s.meaning}</div>
                    <div style={{display:"flex",gap:8,flexWrap:"wrap",alignItems:"center"}}>
                      <ListenBtn text={s.text} rate={0.65} label="🐢 느리게" langCode={L.code} voiceStart={L.voiceStart}/>
                      <ListenBtn text={s.text} rate={0.9} label="🔊 보통" langCode={L.code} voiceStart={L.voiceStart}/>
                      <button onClick={()=>setDone(d=>d.includes(i)?d.filter(x=>x!==i):[...d,i])}
                        style={{background:done.includes(i)?"#1e3a2a":"transparent",border:`1px solid ${done.includes(i)?C.success:C.cardBorder}`,borderRadius:8,padding:"8px 14px",color:done.includes(i)?C.success:C.creamMuted,fontFamily:"'DM Sans',sans-serif",fontSize:12,cursor:"pointer",marginLeft:"auto"}}>
                        {done.includes(i)?"✅ 완료":"☐ 완료"}
                      </button>
                    </div>
                  </div>
                ))}
                <div style={{textAlign:"center",marginBottom:14}}>
                  <span style={{fontFamily:"'DM Sans',sans-serif",fontSize:13,color:done.length>=3?C.gold:C.muted}}>{done.length}/5 완료</span>
                </div>
                <button style={S.btn} onClick={()=>setScreen("speaking")}>{done.length>=3?"🎤 의견 말하기 (스피킹) →":"건너뛰고 스피킹 →"}</button>
                <button style={S.btnSec} onClick={()=>setScreen("listening")}>← 듣기로 돌아가기</button>
              </div>
            )}

            {/* SPEAKING */}
            {screen==="speaking"&&lesson&&(
              <div style={{paddingTop:32}}>
                <StepBar step={3}/>
                <div style={S.label}>STEP 4 — 스피킹 (의견 표현)</div>
                <div style={S.h2}>당신의 생각을 들려주세요</div>
                <p style={{color:C.creamMuted,fontSize:13,marginBottom:18,lineHeight:1.7}}>이 뉴스에 대해 어떻게 생각하시나요? 난이도를 골라 답해보세요.</p>

                {lesson.speakingQuestions?.map((q,i)=>(
                  <QuestionCard key={i} q={q} selected={selectedQ?.level===q.level} onSelect={setSelectedQ} langCode={L.code} voiceStart={L.voiceStart}/>
                ))}

                {selectedQ&&(
                  <div style={{...S.card,borderTop:`2px solid ${LEVEL_COLOR[selectedQ.level]||C.gold}`,marginTop:4}}>
                    <div style={S.h3}>{hasMic?"🎤 음성으로 의견 말하기":`✍️ ${L.name}로 작성하기`}</div>
                    {hasMic?(
                      <>
                        <MicButton onTranscript={setUserResp} langCode={L.code}/>
                        {userResp&&<><div style={{...S.h3,marginBottom:6,marginTop:10}}>📝 인식된 텍스트 (수정 가능)</div><textarea style={S.textarea} value={userResp} onChange={e=>setUserResp(e.target.value)}/></>}
                        {!userResp&&<><div style={{color:C.muted,fontFamily:"'DM Sans',sans-serif",fontSize:12,marginBottom:8,textAlign:"center"}}>또는 직접 입력</div><textarea style={{...S.textarea,minHeight:80}} value={userResp} onChange={e=>setUserResp(e.target.value)} placeholder={`${L.name}로 입력...`}/></>}
                      </>
                    ):(
                      <textarea style={S.textarea} value={userResp} onChange={e=>setUserResp(e.target.value)} placeholder="Type your response..."/>
                    )}
                  </div>
                )}

                {!selectedQ&&(
                  <div style={{...S.card,background:"#0a1220",border:`1px dashed ${C.cardBorder}`,textAlign:"center"}}>
                    <div style={{color:C.muted,fontFamily:"'DM Sans',sans-serif",fontSize:14}}>↑ 위에서 질문을 선택해주세요</div>
                  </div>
                )}

                <button style={{...S.btn,opacity:(userResp.trim()&&selectedQ)?1:0.4,marginTop:4}} onClick={submitSpeaking} disabled={!userResp.trim()||!selectedQ}>AI 교정 받기 →</button>
                <button style={S.btnSec} onClick={()=>setScreen("shadowing")}>← 쉐도잉으로</button>
              </div>
            )}

            {/* FEEDBACK */}
            {screen==="feedback"&&feedback&&(
              <div style={{paddingTop:32}}>
                <StepBar step={4}/>
                <div style={S.label}>STEP 5 — AI 교정 및 심화</div>
                {selectedQ&&(
                  <div style={{display:"inline-flex",alignItems:"center",gap:6,background:LEVEL_COLOR[selectedQ.level]+"22",border:`1px solid ${LEVEL_COLOR[selectedQ.level]}`,borderRadius:20,padding:"4px 14px",marginBottom:14}}>
                    <span>{LEVEL_EMOJI[selectedQ.level]}</span>
                    <span style={{fontFamily:"'DM Sans',sans-serif",fontSize:12,color:LEVEL_COLOR[selectedQ.level]}}>{selectedQ.level} 레벨 답변 분석 완료</span>
                  </div>
                )}
                <p style={{color:C.gold,fontSize:14,fontFamily:"'DM Sans',sans-serif",marginBottom:18,fontStyle:"italic"}}>{feedback.encouragement}</p>

                <div style={S.card}>
                  <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:10}}>
                    <div style={S.h3}>✅ 자연스럽고 정제된 버전</div>
                    <ListenBtn text={feedback.correctedVersion} label="🔊 듣기" langCode={L.code} voiceStart={L.voiceStart}/>
                  </div>
                  <p style={{color:C.success,lineHeight:1.85,fontSize:15,margin:0,fontStyle:"italic"}}>{feedback.correctedVersion}</p>
                </div>

                {feedback.corrections?.length>0&&(
                  <div style={S.card}>
                    <div style={S.h3}>📝 문법 및 어휘 교정</div>
                    {feedback.corrections.map((c,i)=>(
                      <div key={i} style={{background:"#0a1220",border:`1px solid ${C.cardBorder}`,borderRadius:8,padding:"12px 14px",marginBottom:8}}>
                        <div style={{display:"flex",alignItems:"center",gap:8,flexWrap:"wrap",marginBottom:6}}>
                          <span style={{fontSize:13,color:C.error,textDecoration:"line-through",fontStyle:"italic"}}>{c.original}</span>
                          <span style={{color:C.muted}}>→</span>
                          <span style={{fontSize:13,color:C.success,fontWeight:600}}>{c.correction}</span>
                        </div>
                        <div style={{fontSize:13,color:C.creamMuted,fontFamily:"'DM Sans',sans-serif",paddingTop:6,borderTop:`1px solid ${C.cardBorder}`}}>🇰🇷 {c.explanation}</div>
                      </div>
                    ))}
                  </div>
                )}
                {feedback.corrections?.length===0&&(
                  <div style={{...S.card,borderColor:"#1e3a2a",background:"#0a1a0f"}}>
                    <div style={{color:C.success,fontFamily:"'DM Sans',sans-serif",fontSize:14}}>🎉 훌륭합니다! 교정할 부분이 거의 없습니다.</div>
                  </div>
                )}

                <div style={S.card}>
                  <div style={S.h3}>⚡ 고급 어휘 제안</div>
                  {feedback.naturalExpressions?.map((e,i)=>(
                    <div key={i} style={{background:"#0a1220",border:`1px solid #1e3a2a`,borderRadius:8,padding:"12px 14px",marginBottom:8}}>
                      <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:6}}>
                        <div style={{fontFamily:"'Cormorant Garamond',serif",fontSize:17,color:C.goldLight}}>"{e.expression}"</div>
                        <ListenBtn text={e.expression} label="🔊" langCode={L.code} voiceStart={L.voiceStart}/>
                      </div>
                      <div style={{fontSize:13,color:C.creamMuted,fontFamily:"'DM Sans',sans-serif"}}>🇰🇷 {e.usage}</div>
                    </div>
                  ))}
                </div>

                <div style={{...S.card,borderLeft:`3px solid ${C.gold}`}}>
                  <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:10}}>
                    <div style={S.h3}>💬 심화 질문 (Follow-up)</div>
                    <ListenBtn text={feedback.followUpQuestion} label="🔊" langCode={L.code} voiceStart={L.voiceStart}/>
                  </div>
                  <div style={{fontFamily:"'Cormorant Garamond',serif",fontSize:19,color:C.cream,marginBottom:14}}>{feedback.followUpQuestion}</div>
                  {hasMic?(
                    <>
                      <MicButton onTranscript={setFollowup} langCode={L.code}/>
                      {followup&&<textarea style={{...S.textarea,marginTop:10}} value={followup} onChange={e=>setFollowup(e.target.value)}/>}
                      {!followup&&<textarea style={{...S.textarea,marginTop:10,minHeight:80}} value={followup} onChange={e=>setFollowup(e.target.value)} placeholder="또는 직접 입력..."/>}
                    </>
                  ):(
                    <textarea style={S.textarea} value={followup} onChange={e=>setFollowup(e.target.value)} placeholder="Answer here..."/>
                  )}
                </div>

                <button style={{...S.btn,opacity:followup.trim()?1:0.4}} onClick={submitFollowup} disabled={!followup.trim()}>레슨 완료하기 →</button>
<button style={S.btnSec} onClick={async()=>{
  setLoadingMsg("마무리 피드백 정리 중");setScreen("loading");
  try{
    const sys=`You are a professional ${activeLang} teacher. Return ONLY valid JSON no markdown.
{"correctedVersion":"","corrections":[],"finalNote":"한국어 마무리 2문장","todaysPhrases":["핵심표현1","핵심표현2","핵심표현3"]}`;
    const t=await callAI(`Summarize today's lesson on: ${topic?.title}. Give encouraging finalNote in Korean and 3 key ${activeLang} phrases learned today.`,sys);
    const d=parseJSON(t);setFinalFb(d);
    const ns=streak+1;setStreak(ns);saveStreak(ns,activeLang);
    setScreen("complete");
  }catch(e){setError(e.message);setScreen("feedback");}
}}>추가 질문 건너뛰기 →</button>
              </div>
            )}

            {/* COMPLETE */}
            {screen==="complete"&&finalFb&&(
              <div style={{paddingTop:44}}>
                <div style={{textAlign:"center",marginBottom:28}}>
                  <div style={{fontSize:48,marginBottom:10}}>🎉</div>
                  <div style={{fontFamily:"'Cormorant Garamond',serif",fontSize:34,color:C.gold,marginBottom:10}}>오늘의 학습 완료!</div>
                  <div style={{display:"inline-block",background:C.gold+"22",border:`1px solid ${C.gold}`,borderRadius:20,padding:"5px 18px",fontFamily:"'DM Sans',sans-serif",fontSize:14,color:C.gold}}>🔥 {streak}일 연속 학습 중</div>
                </div>

                <div style={{...S.card,background:"#0d1a2a",borderColor:"#2a4a6a",marginBottom:20}}>
                  <div style={S.h3}>📤 복습 노트 공유하기</div>
                  <p style={{color:C.creamMuted,fontSize:13,fontFamily:"'DM Sans',sans-serif",lineHeight:1.7,marginBottom:14}}>
                    오늘 다룬 뉴스 요약과 핵심 어휘를 내보냅니다.<br/>메모 앱에 저장해두고 틈틈이 복습하세요.
                  </p>
                  <button onClick={handleShare} style={{...S.btn,background:shareStatus==="copied"||shareStatus==="shared"?C.success:C.blue,color:"white"}}>
                    {shareStatus==="copied"?"✅ 클립보드에 복사됨!":shareStatus==="shared"?"✅ 공유 완료!":shareStatus==="failed"?"❌ 직접 복사해주세요":"📤 복습 노트 공유하기"}
                  </button>
                </div>

                {finalFb.corrections?.length>0&&(
                  <div style={S.card}>
                    <div style={S.h3}>📝 마지막 교정</div>
                    {finalFb.corrections.map((c,i)=>(
                      <div key={i} style={{background:"#0a1220",border:`1px solid ${C.cardBorder}`,borderRadius:8,padding:"12px 14px",marginBottom:8}}>
                        <div style={{display:"flex",alignItems:"center",gap:8,flexWrap:"wrap",marginBottom:4}}>
                          <span style={{fontSize:13,color:C.error,textDecoration:"line-through",fontStyle:"italic"}}>{c.original}</span>
                          <span style={{color:C.muted}}>→</span>
                          <span style={{fontSize:13,color:C.success}}>{c.correction}</span>
                        </div>
                        <div style={{fontSize:12,color:C.creamMuted,fontFamily:"'DM Sans',sans-serif",paddingTop:4,borderTop:`1px solid ${C.cardBorder}`}}>🇰🇷 {c.explanation}</div>
                      </div>
                    ))}
                  </div>
                )}

                <div style={S.card}>
                  <div style={S.h3}>💡 오늘 배운 핵심 표현</div>
                  {finalFb.todaysPhrases?.map((p,i)=>(
                    <div key={i} style={{display:"flex",alignItems:"center",justifyContent:"space-between",padding:"10px 12px",background:"#0a1220",borderRadius:8,marginBottom:8}}>
                      <div style={{display:"flex",alignItems:"center",gap:10}}>
                        <span style={{color:C.gold,fontFamily:"'DM Sans',sans-serif",fontWeight:600}}>{String(i+1).padStart(2,"0")}</span>
                        <span style={{fontFamily:"'Cormorant Garamond',serif",fontSize:16,color:C.cream}}>{p}</span>
                      </div>
                      <ListenBtn text={p} label="🔊" langCode={L.code} voiceStart={L.voiceStart}/>
                    </div>
                  ))}
                </div>

                <div style={{...S.card,borderColor:"#1e3a2a",background:"#091510"}}>
                  <div style={{color:C.creamMuted,lineHeight:1.8,fontSize:15}}>{finalFb.finalNote}</div>
                </div>

                <button style={S.btn} onClick={reset}>홈으로 돌아가기</button>
                <button style={S.btnSec} onClick={()=>{reset();setTimeout(fetchTopics,100);}}>다른 주제로 한 번 더 →</button>
              </div>
            )}
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
  </script>
</body>
</html>
